<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EverStub Ticket</title>
  <style>
    /* 100% Self-contained Swiss Typographic & Layout Engine (Zero External Dependencies) */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 384px;
      height: 682.667px; /* 384 * 16 / 9 */
      overflow: hidden;
      background: #ffffff;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .font-display {
      font-family: 'Oswald', 'DIN Alternate', 'Trebuchet MS', 'Impact', sans-serif;
    }

    .font-swiss {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    #ticket-node {
      width: 384px;
      height: 682.667px;
      position: relative;
      background-color: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-align: left;
      color: #000000;
    }

    /* 1. Artwork Block (Strictly 1:1 Square) */
    .artwork-container {
      width: 384px;
      height: 384px;
      position: relative;
      background-color: #f3f4f6;
      overflow: hidden;
      flex-shrink: 0;
      border-bottom: 4px solid #000000;
    }

    .artwork-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Bottom Information Area */
    .info-container {
      flex: 1;
      width: 100%;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 2. Title Section (Fixed Height 112px / h-28) */
    .title-section {
      height: 112px;
      padding: 12px 20px;
      border-bottom: 2px solid #000000;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .movie-en {
      font-family: 'Oswald', 'DIN Alternate', 'Impact', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: -0.025em;
      color: #000000;
      word-break: break-word;
      margin-bottom: 4px;
    }

    .movie-cn {
      font-weight: 700;
      color: #000000;
      letter-spacing: -0.025em;
      line-height: 1;
    }

    /* 3. Data Grid Section (Fixed Height 96px / h-24) */
    .data-grid {
      height: 96px;
      display: flex;
      width: 100%;
      border-bottom: 2px solid #000000;
      flex-shrink: 0;
      flex-grow: 0;
    }

    .theater-left {
      width: 55%;
      border-right: 2px solid #000000;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .theater-slot {
      padding: 0 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
    }

    .theater-slot-bordered {
      border-bottom: 2px solid #000000;
    }

    .theater-right {
      width: 45%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      overflow: hidden;
    }

    .home-left {
      width: 50%;
      border-right: 2px solid #000000;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      overflow: hidden;
    }

    .home-right {
      width: 50%;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      height: 100%;
      overflow: hidden;
    }

    .field-label {
      display: block;
      font-size: 10px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 2px;
      color: #6b7280;
    }

    .field-value {
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .location-value {
      font-weight: 700;
      white-space: pre-line;
      line-height: 1.25;
    }

    /* 4. Barcode Footer (Fills remaining height) */
    .barcode-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 20px;
      width: 100%;
      overflow: hidden;
    }

    .barcode-container {
      height: 24px;
      width: 100%;
      display: flex;
      align-items: stretch;
      justify-content: space-between;
      overflow: hidden;
      user-select: none;
    }

    .bg-black { background-color: #000000; }
    .flex-shrink-0 { flex-shrink: 0; }
    .hidden { display: none !important; }

    /* Dynamic Typography Scale Classes */
    .text-5xl { font-size: 48px; }
    .text-4xl { font-size: 36px; }
    .text-3xl { font-size: 30px; }
    .text-2xl { font-size: 24px; }
    .text-xl  { font-size: 20px; }
    .text-lg  { font-size: 18px; }
    .text-base{ font-size: 16px; }
    .text-sm  { font-size: 14px; }
    .text-xs  { font-size: 12px; }
    .text-10px{ font-size: 10px; }

    .leading-08 { line-height: 0.8; }
    .leading-085{ line-height: 0.85; }
    .leading-09 { line-height: 0.9; }
    .leading-tight { line-height: 1.1; }
  </style>
</head>

  <script id="ticket-data-json" type="application/json">
    /* __TICKET_DATA_PLACEHOLDER__ */

  <script>
    // --- Dynamic Typography Rules (100% EverStub Matching) ---
    function applyTitleClasses(el, text) {
      const len = text.length;
      if (len < 10) { el.classList.add('text-5xl', 'leading-08'); }
      else if (len < 18) { el.classList.add('text-4xl', 'leading-085'); }
      else if (len < 30) { el.classList.add('text-3xl', 'leading-09'); }
      else { el.classList.add('text-xl', 'leading-tight'); }
    }

    function applyCnTitleClass(el, text) {
      const len = text.length;
      if (len < 8) { el.classList.add('text-2xl'); }
      else if (len < 15) { el.classList.add('text-xl'); }
      else { el.classList.add('text-base'); }
    }

    function applyDataValueClass(el, text) {
      const len = text.length;
      if (len < 12) { el.classList.add('text-lg'); }
      else if (len < 18) { el.classList.add('text-base'); }
      else { el.classList.add('text-sm'); }
    }

    function applyLocationClass(el, text) {
      const len = text.length;
      if (len < 20) { el.classList.add('text-sm'); }
      else if (len < 40) { el.classList.add('text-xs'); }
      else { el.classList.add('text-10px'); }
    }

    function renderData() {
      const raw = document.getElementById('ticket-data-json').textContent.trim();
      if (!raw || raw.includes('__TICKET_DATA_PLACEHOLDER__')) return;
      const data = JSON.parse(raw);

      // Artwork
      const artImg = document.getElementById('artwork-img');
      const artSrc = data.artwork_data_uri || data.artwork_path || data.generatedImageUrl;
      if (artSrc) {
        artImg.src = artSrc;
      }

      // Titles
      const enEl = document.getElementById('movie-en');
      enEl.textContent = data.movie_en || 'MOVIE TITLE';
      applyTitleClasses(enEl, enEl.textContent);

      const cnEl = document.getElementById('movie-cn');
      cnEl.textContent = data.movie_cn || '';
      applyCnTitleClass(cnEl, cnEl.textContent);

      // Modes
      const isTheater = (data.mode || 'THEATER') === 'THEATER';
      const gridTheater = document.getElementById('grid-theater');
      const gridHome = document.getElementById('grid-home');

      if (isTheater) {
        gridTheater.classList.remove('hidden');
        gridHome.classList.add('hidden');

        const timeEl = document.getElementById('time-val-theater');
        timeEl.textContent = data.time_val || '';
        applyDataValueClass(timeEl, timeEl.textContent);

        const priceEl = document.getElementById('price-val-theater');
        priceEl.textContent = data.price_val || '';
        applyDataValueClass(priceEl, priceEl.textContent);

        const locEl = document.getElementById('location-val-theater');
        locEl.textContent = data.location_val || '';
        applyLocationClass(locEl, locEl.textContent);
      } else {
        gridTheater.classList.add('hidden');
        gridHome.classList.remove('hidden');

        const timeEl = document.getElementById('time-val-home');
        timeEl.textContent = data.time_val || '';
        applyDataValueClass(timeEl, timeEl.textContent);

        const locEl = document.getElementById('location-val-home');
        locEl.textContent = data.location_val || '';
        applyLocationClass(locEl, locEl.textContent);
      }
    }

    renderData();
  </script>
